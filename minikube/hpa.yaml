# Horizontal Pod Autoscaler da aplicação web.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: trabalho-hpa

spec:
  # Deployment cujo número de réplicas será controlado.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-hpa

  # Limites mínimo e máximo de réplicas.
  minReplicas: 1
  maxReplicas: 10

  # Métrica utilizada para decisão de escalamento.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
